[workspace]
members = ["crates/pixcore", "crates/pixpapers"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lariocpt/pixelated-papers"
description = "Forced-pixelation wallpapers for niri and other wayland compositors"

[workspace.dependencies]
pixcore = { path = "crates/pixcore" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "6"
blake3 = "1"
tempfile = "3"
png = "0.17"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2"
env_logger = "0.11"
log = "0.4"
proptest = "1"
snapbox = "0.6"
criterion = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
