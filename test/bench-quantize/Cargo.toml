# Test-only bench helper (PLAN-30 S3). Deliberately NOT a workspace member:
# it owns its workspace so `cargo test/clippy/fmt --workspace` never touches
# it, and it is driven only through test/bench-dither.sh / test/bench-sizes.sh.
[workspace]

[package]
name = "bench-quantize"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
pixcore = { path = "../../crates/pixcore" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "ico"] }
blake3 = "1"

# Mirror the root release profile — bench numbers must reflect the shipped
# build (AGENTS.md: benchmarks run --release only).
[profile.release]
lto = true
codegen-units = 1
strip = true
