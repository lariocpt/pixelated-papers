[package]
name = "pixpapers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme = "../../README.md"
keywords = ["wayland", "niri", "wallpaper", "pixel-art", "layer-shell"]
categories = ["command-line-utilities"]

[features]
default = ["x11"]
# X11 root-window backend (x11rb). On by default: X11 is a supported target;
# off for a wayland-only slim build.
x11 = ["dep:x11rb"]

[dependencies]
x11rb = { workspace = true, optional = true }
pixcore = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
dirs = { workspace = true }

libc = { workspace = true }
memmap2 = "0.9"
png = { workspace = true }
tempfile = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }

[target.'cfg(unix)'.dependencies]
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
wayland-protocols-wlr = { workspace = true }

[dev-dependencies]
snapbox = { workspace = true }
